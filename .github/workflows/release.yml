name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  # ── 1. Always runs: type-check + unit tests ──────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix vscode-extension ci

      - name: Type-check
        working-directory: vscode-extension
        run: |
          npx tsc --noEmit -p tsconfig.json
          npx tsc --noEmit -p tsconfig.test.json

      - name: Run unit tests (Mocha)
        run: npm test

      - name: Webpack production compile
        run: npm run package

  # ── 2. Only on version tags, only if tests passed: build + publish release ─
  release:
    name: Build VSIX & Publish Release
    needs: test
    runs-on: ubuntu-latest
    outputs:
      vsix_name: ${{ steps.locate.outputs.vsix_name }}
      version: ${{ steps.locate.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix vscode-extension ci

      - name: Build VSIX
        run: npm run package:vsix

      - name: Locate VSIX and version
        id: locate
        working-directory: vscode-extension
        run: |
          FILE=$(ls -t contextlens-agent-*.vsix | head -n1)
          VERSION=${GITHUB_REF_NAME#v}
          echo "vsix_name=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ContextLens ${{ github.ref_name }}
          generate_release_notes: true
          files: vscode-extension/${{ steps.locate.outputs.vsix_name }}

  # ── 3. Only after a successful release: auto-update docs on main ──────────
  update-docs:
    name: Update Docs & Changelog
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update CONTEXT.md and CHANGELOG.md
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          # Update "Last Updated" line in CONTEXT.md
          if [ -f CONTEXT.md ]; then
            sed -i "s/\*Last Updated: .*/\*Last Updated: $TODAY | Version: $VERSION*/" CONTEXT.md
          fi

          # Prepend a new entry to CHANGELOG.md (Keep a Changelog format)
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" -v date="$TODAY" '
              /^## \[Unreleased\]/ && !done {
                print;
                print "";
                print "## [" ver "] - " date;
                done=1;
                next
              }
              { print }
            ' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md
          fi

      - name: Commit and push doc updates
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: sync CONTEXT.md and CHANGELOG.md for v${{ needs.release.outputs.version }} [skip ci]"
          branch: main
          file_pattern: 'CONTEXT.md CHANGELOG.md'

