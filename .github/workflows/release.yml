name: Release Automation

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write

jobs:
  auto-release:
    name: Auto Release & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check or Bump Version
        id: version_check
        run: |
          # 1. If triggered via manual GitHub UI dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.bump }}" != "none" ]; then
            echo "Manual UI dispatch requested bump: ${{ inputs.bump }}"
            node scripts/bump.js "${{ inputs.bump }}"
            NEW_VER=$(node -p "require('./vscode-extension/package.json').version")
            git add -A
            git commit -m "chore(release): bump version to $NEW_VER [skip ci]" || true
            git push origin main || true
          fi

          # 2. If commit message contains [release], [release patch], [release minor], [release major]
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if echo "$COMMIT_MSG" | grep -iq '\[release major\]'; then
            echo "Commit message requested major release bump"
            node scripts/bump.js major
            NEW_VER=$(node -p "require('./vscode-extension/package.json').version")
            git add -A
            git commit -m "chore(release): bump version to $NEW_VER [skip ci]" || true
            git push origin main || true
          elif echo "$COMMIT_MSG" | grep -iq '\[release minor\]'; then
            echo "Commit message requested minor release bump"
            node scripts/bump.js minor
            NEW_VER=$(node -p "require('./vscode-extension/package.json').version")
            git add -A
            git commit -m "chore(release): bump version to $NEW_VER [skip ci]" || true
            git push origin main || true
          elif echo "$COMMIT_MSG" | grep -iqE '\[release patch\]|\[release\]'; then
            echo "Commit message requested patch release bump"
            node scripts/bump.js patch
            NEW_VER=$(node -p "require('./vscode-extension/package.json').version")
            git add -A
            git commit -m "chore(release): bump version to $NEW_VER [skip ci]" || true
            git push origin main || true
          fi

          # 3. Check current version & tag state
          VERSION=$(node -p "require('./vscode-extension/package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on git."
            if [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
              echo "Triggered explicitly by tag push. Proceeding to release."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "Version $VERSION is already released. No new release needed."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "New version $VERSION detected. Creating tag $TAG and triggering release."
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG" || true
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version_check.outputs.should_release == 'true'
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json

      - name: Install dependencies
        if: steps.version_check.outputs.should_release == 'true'
        run: |
          npm ci
          npm --prefix vscode-extension ci

      - name: Type-check
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: vscode-extension
        run: |
          npx tsc --noEmit -p tsconfig.json
          npx tsc --noEmit -p tsconfig.test.json

      - name: Run unit tests (Mocha)
        if: steps.version_check.outputs.should_release == 'true'
        run: npm test

      - name: Build VSIX
        if: steps.version_check.outputs.should_release == 'true'
        run: npm run package:vsix

      - name: Locate VSIX artifact
        if: steps.version_check.outputs.should_release == 'true'
        id: locate
        working-directory: vscode-extension
        run: |
          FILE=$(ls -t contextlens-agent-*.vsix | head -n1)
          echo "vsix_name=$FILE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.version_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_check.outputs.tag }}
          name: ContextLens ${{ steps.version_check.outputs.tag }}
          generate_release_notes: true
          files: vscode-extension/${{ steps.locate.outputs.vsix_name }}

      - name: Update CONTEXT.md and CHANGELOG.md
        if: steps.version_check.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.version_check.outputs.version }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ -f CONTEXT.md ]; then
            sed -i "s/\*Last Updated: .*/\*Last Updated: $TODAY | Version: $VERSION*/" CONTEXT.md
          fi
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" -v date="$TODAY" '
              /^## \[Unreleased\]/ && !done {
                print;
                print "";
                print "## [" ver "] - " date;
                done=1;
                next
              }
              { print }
            ' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md
          fi

      - name: Commit and push doc updates
        if: steps.version_check.outputs.should_release == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: sync CONTEXT.md and CHANGELOG.md for ${{ steps.version_check.outputs.tag }} [skip ci]"
          branch: main
          file_pattern: 'CONTEXT.md CHANGELOG.md'
